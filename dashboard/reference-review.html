<!doctype html><meta charset="utf-8"><title>Motion reference review</title><style>body{margin:0;background:#202020;color:white;font:16px Arial}nav{padding:8px;display:flex;gap:8px}button{padding:10px}video{display:block;width:100%;height:calc(100vh - 65px);object-fit:contain}</style><nav id="seek"></nav><video src="reference-review.mp4" controls muted preload="auto"></video><script>const v=document.querySelector('video');for(let i=0;i<=10;i++){const b=document.createElement('button');b.textContent=i*10+'%';b.onclick=()=>{v.pause();v.currentTime=Math.min(v.duration-.05,v.duration*i/10)};document.querySelector('#seek').append(b);}</script>
